# dsh-auto-memory bundle patch.
#
# The row id stays readable and stable for profile overrides; the module name
# is the scoped npm package. Selecting this bundle in `dsh.profile.bundles`
# mounts the memory tool and the rule loader.
- insert:
    - id: dsh-auto-memory
      name: '@y0shua1ee/dsh-auto-memory'
